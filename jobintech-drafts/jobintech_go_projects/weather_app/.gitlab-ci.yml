# .gitlab-ci.yml
stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  MANIFESTS_REPO: "git@gitlab.com:elfaouzi/weather-manifests.git"

# Docker-in-Docker
services:
  - docker:20-dind

# === DEFAULT: Only for build jobs ===
default:
  image: docker:20
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

