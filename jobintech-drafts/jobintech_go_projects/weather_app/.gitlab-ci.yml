# === BUILD FRONTEND (NEEDS DOCKER) ===
build-frontend:
  stage: build
  script:
    - cd react-web-weatherapp-e12
    - docker build -t $FRONTEND_IMAGE .
    - docker push $FRONTEND_IMAGE
  only: [main]

# === DEPLOY: Update weather-manifests ===
update-manifests:
  stage: deploy
  image: alpine
  before_script: []
  script:
    - apk add --no-cache git yq
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/elfaouzi/weather-manifests.git /tmp/manifests
    - cd /tmp/manifests
    # - yq e -i ".spec.template.spec.containers[0].image = \"$BACKEND_IMAGE\"" k8s/deployment-backend.yaml
    - yq e -i ".spec.template.spec.containers[0].image = \"$FRONTEND_IMAGE\"" k8s/frontend.yaml
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git add .
    - git commit -m "Deploy $CI_COMMIT_SHORT_SHA"
    - git remote set-url origin https://oauth2:${MANIFESTS_TOKEN}@gitlab.com/elfaouzi/weather-manifests.git
    - git push origin HEAD:main
  only: [main]
    