<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --chat-bg: #ffffff;
      --primary-color: #0084ff;
      --text-color: #050505;
      --secondary-text: #65676b;
      --received-bg: #e4e6eb;
      --sent-text: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      display: flex;
      justify-content: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      background-color: var(--chat-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      height: 100%;
    }

    .header {
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      background: white;
      z-index: 10;
    }

    .header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--text-color);
    }

    .status-dot {
      height: 10px;
      width: 10px;
      background-color: #31a24c;
      border-radius: 50%;
      margin-right: 10px;
      display: inline-block;
    }

    #messages {
      flex: 1;
      list-style-type: none;
      padding: 20px;
      margin: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .message.received {
      background-color: var(--received-bg);
      color: var(--text-color);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.sent {
      background-color: var(--primary-color);
      color: var(--sent-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .sender-name {
      font-size: 0.75rem;
      color: var(--secondary-text);
      margin-bottom: 4px;
      display: block;
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0073e6;
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <div class="header">
      <span class="status-dot"></span>
      <h2>Chat with Abdellatif</h2>
    </div>

    <ul id="messages">
      <!-- Messages will appear here -->
    </ul>

    <form class="input-area" id="form">
      <input id="input" autocomplete="off" placeholder="Type a message..." />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Load Socket.IO from local file for LAN offline support -->
  <script src="socket.io.min.js"></script>
  <script>
    // Configuration
    const HARDCODED_IP = "192.168.2.104";
    const isFile = window.location.protocol === 'file:';
    const serverUrl = isFile ? `http://${HARDCODED_IP}:3000` : undefined;

    const socket = io(serverUrl);

    // DOM Elements
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    // Connection events
    socket.on("connect", () => {
      console.log("Connected to server");
    });

    // Listen for incoming messages
    socket.on("chat message", (data) => {
      // Logic to determine sender name
      // If server sends { sender: "Host", ... }, we display "Abdellatif"
      let senderName = "Abdellatif";
      let textContent = "";

      if (typeof data === 'object') {
        textContent = data.text;
        if (data.sender && data.sender !== 'Host') {
          senderName = data.sender;
        }
      } else {
        textContent = data; // Fallback for old string format
      }

      addMessage(textContent, 'received', senderName);
    });

    // Handle sending messages
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!input.value.trim()) return;

      const msgText = input.value;

      // Send to server
      socket.emit("chat message", msgText);

      // Display locally immediately
      addMessage(msgText, 'sent', 'You');

      input.value = "";
    });

    function addMessage(text, type, senderName) {
      const li = document.createElement("li");
      li.classList.add("message", type);

      // Only show name for received messages
      if (type === 'received') {
        const nameSpan = document.createElement("span");
        nameSpan.classList.add("sender-name");
        nameSpan.textContent = senderName;
        li.appendChild(nameSpan);
      }

      const textNode = document.createTextNode(text);
      li.appendChild(textNode);

      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>

</html>
