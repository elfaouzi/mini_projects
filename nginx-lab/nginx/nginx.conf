worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --------------------
    # Upstream Node.js cluster
    # --------------------
    upstream nodejs_cluster {
        server app-1:3000;
        server app-2:3000;
        server app-3:3000;
        server app-4:3000;
    }

    # --------------------
    # Rate limiting
    # --------------------
    # limit requests to 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;

    # --------------------
    # Caching static files
    # --------------------
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=STATIC:10m max_size=50m inactive=1h use_temp_path=off;

    # --------------------
    # Security headers
    # --------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------
    # HTTP → HTTPS redirect
    # --------------------
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # --------------------
    # HTTPS server
    # --------------------
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # Rate limiting
        limit_req zone=one burst=10 nodelay;

        # Security headers applied globally for this server
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --------------------
        # Frontend: static files served from Nginx
        # --------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
            expires 1h;                  # caching static files

            
            # Add security headers here too with "always"
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            add_header Cache-Control "public";
        }

        # --------------------
        # Backend API: Node.js
        # --------------------
        location /api {
            proxy_pass http://nodejs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Retry if upstream fails
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            # Optional caching for API (can be commented out)
            # proxy_cache STATIC;
            # proxy_cache_valid 200 10m;
        }

        # --------------------
        # Optional: deny access to hidden files
        # --------------------
        location ~ /\. {
            deny all;
        }
    }
}
