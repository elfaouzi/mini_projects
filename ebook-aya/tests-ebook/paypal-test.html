<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PayPal Test</title>
  </head>
  <body>

    <h1>Buy Ebook – $10</h1>

    <div id="paypal-button-container"></div>

    <script src="https://www.paypal.com/sdk/js?client-id=AXeZyO9-ju8ZkbYFVwmFNqlj6QnItRW-3oc32yEZDT93Gl2w_79EQ-SPiIkum5Cd0cgEq16AfCVNEDTp&currency=USD"></script>

    <script>
      paypal.Buttons({
        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{
              amount: {
                value: '10.00'
              }
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(function(details) {
            alert('Payment completed successfully!');
            console.log(details);
          });
        }
      }).render('#paypal-button-container');
    </script>

  </body>
</html>
